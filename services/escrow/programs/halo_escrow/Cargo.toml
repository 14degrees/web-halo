[package]
name = "halo_escrow"
version = "0.1.0"
description = "Halo Web's match escrow: players' SOL for wagered matches"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "halo_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "1.2.0"

[dev-dependencies]
litesvm = "0.17.0"
solana-clock = "3.2"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-pubkey = "3"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-system-interface = "3.2"
